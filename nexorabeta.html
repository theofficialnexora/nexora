<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nexora — Your space. Your stuff.</title>
<style>
:root{--acc:#4f8cff;--r:18px;--blur:22px;--bg:#07070c;--tx:#eceef6;--mu:#8b8fa3;--gl:rgba(255,255,255,.055);--bd:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:var(--gl);border:1px solid var(--bd);border-radius:12px;padding:8px 14px;transition:.2s}button:hover{border-color:var(--acc);background:rgba(255,255,255,.09)}
.pri{background:linear-gradient(135deg,#7c3aed,var(--acc));border:0;font-weight:600}
input,select,textarea{background:rgba(0,0,0,.35);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;width:100%;outline:0}input:focus,textarea:focus{border-color:var(--acc)}
.logo{font-weight:800;letter-spacing:.32em;background:linear-gradient(90deg,#fff,#a78bfa,var(--acc));-webkit-background-clip:text;color:transparent}
.shell{min-height:100vh;background-size:cover;background-attachment:fixed;display:grid;grid-template-columns:84px 1fr;grid-template-rows:64px 1fr;transition:background .6s}
.top{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 20px;backdrop-filter:blur(var(--blur));background:rgba(5,5,10,.45);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top .sp{flex:1}.srch{max-width:360px;text-align:left;color:var(--mu);flex:1}.bdg{background:#ef4444;border-radius:9px;font-size:11px;padding:0 6px;margin-left:4px}
.side{padding:16px 0;display:flex;flex-direction:column;gap:10px;align-items:center;border-right:1px solid var(--bd);background:rgba(5,5,10,.3);backdrop-filter:blur(var(--blur))}
.side button{width:48px;height:48px;padding:0;font-size:20px;border-radius:14px}.side .on,.bn .on{border-color:var(--acc);box-shadow:0 0 18px -4px var(--acc)}
main{padding:28px;max-width:1300px;width:100%;margin:auto}h1{font-size:26px;margin-bottom:18px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;grid-auto-flow:dense}
.w{grid-column:span 1;background:var(--gl);border:1px solid var(--bd);border-radius:var(--r);padding:16px;backdrop-filter:blur(var(--blur));min-height:170px;display:flex;flex-direction:column;gap:10px;transition:.25s}
.w.s2{grid-column:span 2}.w:hover{border-color:rgba(255,255,255,.22);transform:translateY(-2px)}.w.drag{opacity:.4}
.wh{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.1em;cursor:grab}.wh b{flex:1;font-weight:600}
.wh button{padding:2px 8px;border:0;background:none}.big{font-size:42px;font-weight:700}.mu{color:var(--mu)}
.li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px}.li:hover{background:rgba(255,255,255,.06)}.li a{color:inherit;text-decoration:none;flex:1}.li span{flex:1}
.x{padding:0 6px!important;border:0!important;background:none!important;color:var(--mu)}
.empty{margin:auto;text-align:center;color:var(--mu);padding:14px}.empty i{font-size:28px;display:block;font-style:normal}
.gm{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.gm a{display:block;padding:14px;border-radius:14px;background:linear-gradient(145deg,rgba(124,58,237,.35),rgba(79,140,255,.2));text-decoration:none;color:inherit;text-align:center;border:1px solid var(--bd);transition:.2s}.gm a:hover{transform:scale(1.04)}
.gm a i{font-size:28px;display:block;font-style:normal}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:8vh 14px;z-index:20;overflow:auto;animation:f .2s}
.md{background:rgba(18,18,28,.92);border:1px solid var(--bd);border-radius:22px;padding:22px;width:min(560px,100%);display:flex;flex-direction:column;gap:12px;animation:u .28s cubic-bezier(.2,.8,.2,1)}
.md h2{font-size:18px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row button{flex:0 auto}
.cr{padding:9px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px}.cr.sel{background:rgba(79,140,255,.2)}.cat{font-size:11px;text-transform:uppercase;color:var(--mu);margin:8px 0 2px;letter-spacing:.1em}
.opt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.opt button{padding:18px 8px;font-size:15px}
.sw{height:46px;border-radius:12px;border:2px solid transparent;padding:0}.sw.on{border-color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:12px}.cal div{padding:4px 0;border-radius:8px}.cal .t{background:var(--acc)}.cal .e{box-shadow:inset 0 -3px var(--ec)}
.bn{display:none}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#2a1260,transparent 50%),radial-gradient(circle at 80% 90%,#0d2a6b,transparent 50%),#07070c}
.spin{width:34px;height:34px;border:3px solid var(--bd);border-top-color:var(--acc);border-radius:50%;animation:r 1s linear infinite;margin:auto}
.err{color:#fca5a5;font-size:13px}.in{animation:u .45s cubic-bezier(.2,.8,.2,1) backwards}
.owner-badge{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.05em;margin-left:6px}
.owner-panel .md{width:min(720px,100%)}
.owner-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.owner-grid button{text-align:left;padding:12px 14px}
.owner-grid button b{display:block;font-size:14px}
.owner-grid button span{display:block;font-size:12px;color:var(--mu);margin-top:2px}
.danger{color:#fca5a5!important;border-color:rgba(252,165,165,.35)!important}
.danger:hover{background:rgba(239,68,68,.15)!important;border-color:#fca5a5!important}
pre.raw{background:rgba(0,0,0,.4);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:11px;max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-all}
@keyframes f{from{opacity:0}}@keyframes u{from{opacity:0;transform:translateY(14px) scale(.98)}}@keyframes r{to{transform:rotate(360deg)}}
.noanim *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:820px){.shell{grid-template-columns:1fr;grid-template-rows:60px 1fr}.side{display:none}.top{grid-column:1}.grid{grid-template-columns:1fr}.w.s2{grid-column:span 1}main{padding:16px 14px 100px}
.bn{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(8,8,14,.85);backdrop-filter:blur(20px);border-top:1px solid var(--bd);z-index:6}
.sps{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scroll-snap-type:x mandatory}.sps button{white-space:nowrap;scroll-snap-align:start}.opt{grid-template-columns:repeat(2,1fr)}.hm{display:none}
.owner-grid{grid-template-columns:1fr}}
@media(min-width:821px){.sps{display:none}}
</style></head><body><div id="app"><div class="auth"><div class="spin"></div></div></div>
<script>setTimeout(function(){var a=document.getElementById('app');if(a&&a.querySelector('.spin')&&!window.__nx)a.innerHTML='<div class="auth"><div class="md"><h2>Nexora could not start</h2><p class="err">Firebase scripts did not load or crashed. Open the browser console (F12) for the exact error. Make sure you are online and serving the file over https or localhost.</p></div></div>'},8000);window.addEventListener('error',function(e){console.error(e.message)});</script>
<script type="module">window.__nx=1;
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,deleteUser,updateProfile,createUserWithEmailAndPassword,sendPasswordResetEmail,updatePassword,EmailAuthProvider,reauthenticateWithCredential}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDg8nQxdoVPiYnpwTBW7mpC2V2q9XwuEsU",authDomain:"dadwertghgdhvnbmgvfx.firebaseapp.com",projectId:"dadwertghgdhvnbmgvfx",storageBucket:"dadwertghgdhvnbmgvfx.firebasestorage.app",messagingSenderId:"734452901291",appId:"1:734452901291:web:837d76fdcb794003211eee"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app),db=getFirestore(app);
/* Secondary app so owner can create users without being signed out */
const adminApp=initializeApp(firebaseConfig,'admin');
const adminAuth=getAuth(adminApp);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),id=()=>Math.random().toString(36).slice(2,9);
const OWNER_EMAIL='greyson.kurit@gmail.com';
const isOwner=()=>U&&U.email===OWNER_EMAIL;
const WALLS={midnight:'linear-gradient(160deg,#07070c,#12102a)',purple:'linear-gradient(160deg,#1b0b3a,#4c1d95 70%,#0b0b14)',blue:'linear-gradient(160deg,#050a1c,#0b2a6b)',cyber:'linear-gradient(135deg,#0a0614,#3b0a6b 50%,#0a3d6b)',aurora:'linear-gradient(160deg,#04121a,#0d5c63 40%,#5b21b6 80%,#07070c)',minimal:'#0c0c10'};
const WT={welcome:['👋','Welcome',2],clock:['🕒','Clock',1],notes:['📝','Notes',2],todo:['✅','To-do',1],links:['🔖','Bookmarks',1],games:['🎮','Game launcher',2],calendar:['📅','Calendar',2],timer:['⏱️','Timer',1],activity:['⚡','Activity',1],stats:['📊','Statistics',1]};
const mk=(t)=>({id:id(),type:t,w:WT[t][2]});
const TPL={Gaming:['🎮',['welcome','clock','games','links','activity','stats']],School:['🎓',['welcome','clock','calendar','todo','notes','timer']],Coding:['💻',['welcome','clock','links','notes','todo','activity']],Creative:['🎨',['welcome','clock','notes','links','activity']],Personal:['🏠',['welcome','clock','links','notes','calendar','activity','todo']],'Blank Space':['✨',['welcome']]};
const WK={Gaming:'cyber',School:'blue',Coding:'midnight',Creative:'aurora',Personal:'purple','Blank Space':'minimal'};
let U,S,tab=0,anim=true,timers={},cmdSel=0,saveT,drag;
const cur=()=>S.spaces.find(s=>s.id===S.active)||S.spaces[0];
const space=(n)=>({id:id(),name:n,icon:TPL[n]?.[0]||'✨',wall:WK[n]||'midnight',widgets:(TPL[n]?.[1]||['welcome']).map(mk)});
const fresh=()=>({onboarded:false,prefs:{acc:'#4f8cff',r:18,blur:22,anim:true,vis:true,actvis:true,notif:true},profile:{bio:''},spaces:[],active:null,notes:[],todos:[],bms:[{id:id(),t:'GitHub',u:'https://github.com',f:'Coding'},{id:id(),t:'YouTube',u:'https://youtube.com',f:'General'}],games:[],events:[],activity:[],notifs:[{id:id(),t:'Welcome to Nexora — your space, your stuff.',r:0}]});
const log=t=>{S.activity.unshift({t,d:Date.now()});S.activity=S.activity.slice(0,30)};
function save(){clearTimeout(saveT);saveT=setTimeout(async()=>{try{await setDoc(doc(db,'users',U.uid),{state:JSON.stringify(S),updated:Date.now()});}catch(e){toast('Save failed: '+e.code)}},500)}
function toast(m){const t=document.createElement('div');t.className='md';t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:50;padding:10px 18px';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3000)}
const wall=sp=>sp.wall?.startsWith('c:')?sp.wall.slice(2):sp.wall?.startsWith('u:')?`url(${sp.wall.slice(2)}) center/cover`:WALLS[sp.wall]||WALLS.midnight;
const ago=d=>{const m=Math.round((Date.now()-d)/6e4);return m<1?'just now':m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'};

/* ---------- auth (sign-in only) ---------- */
let aerr='';
function renderAuth(){$('#app').innerHTML=`<div class="auth"><form class="md in" id="af"><div class="logo" style="font-size:28px;text-align:center">NEXORA</div><p class="mu" style="text-align:center">Your space. Your stuff.</p>`
+`<input name="e" type="email" placeholder="Email" required><input name="p" type="password" placeholder="Password (6+ chars)" required minlength="6">`
+`<div class="err">${esc(aerr)}</div><button class="pri">Sign in</button></form></div>`;
$('#af').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),em=f.get('e'),pw=f.get('p');aerr='';try{await signInWithEmailAndPassword(auth,em,pw)}catch(x){aerr=x.code?.replace('auth/','').replace(/-/g,' ')||'Something went wrong'}if(aerr)renderAuth()}}
onAuthStateChanged(auth,async u=>{U=u;if(!u){S=null;return renderAuth()}
$('#app').innerHTML='<div class="auth"><div class="spin"></div></div>';
try{const s=await Promise.race([getDoc(doc(db,'users',u.uid)),new Promise((_,j)=>setTimeout(()=>j({code:'timeout',message:'Firestore did not respond in 10s — is the Firestore database created (Build → Firestore Database → Create database)?'}),10000))]);S=s.exists()?JSON.parse(s.data().state):fresh()}catch(e){$('#app').innerHTML=`<div class="auth"><div class="md"><h2>Couldn't load your data</h2><p class="err">${esc(e.code||e.message)}</p><p class="mu">Check that Firestore is enabled and the security rules are published.</p><button data-a="signout">Sign out</button></div></div>`;return}
try{anim=S.prefs.anim;applyPrefs();if(!S.spaces.length)S.onboarded=false;render()}catch(e){$('#app').innerHTML=`<div class="auth"><div class="md"><h2>Something broke</h2><p class="err">${esc(e.message)}</p><button data-a="signout">Sign out</button></div></div>`}});

function applyPrefs(){const r=document.documentElement.style,p=S.prefs;r.setProperty('--acc',p.acc);r.setProperty('--r',p.r+'px');r.setProperty('--blur',p.blur+'px');document.body.classList.toggle('noanim',!p.anim)}

/* ---------- widgets ---------- */
const empty=(i,t)=>`<div class="empty"><i>${i}</i>${t}</div>`;
const W={
welcome:()=>`<div class="big" style="font-size:28px">Hi, ${esc(U.displayName||'there')}.</div><p class="mu">This is <b style="color:var(--tx)">${esc(cur().name)}</b> — drag widgets to reorder, resize with ⤢, and press <kbd>Ctrl K</kbd> or <kbd>N</kbd> for the command center.${isOwner()?' <span class="owner-badge">OWNER</span>':''}</p><div class="row"><button data-a="lib">+ Add widget</button><button data-a="cust">Customize</button>${isOwner()?'<button data-a="owner">👑 Owner panel</button>':''}</div>`,
clock:()=>`<div class="big" data-clock>${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div><div class="mu">${new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</div>`,
notes:(w)=>{const q=(w.q||'').toLowerCase(),l=[...S.notes].filter(n=>(n.t+n.b).toLowerCase().includes(q)).sort((a,b)=>b.p-a.p||b.u-a.u),n=S.notes.find(x=>x.id===w.sel);
return `<div class="row"><input data-in="nq" data-w="${w.id}" placeholder="Search notes" value="${esc(w.q||'')}"><button data-a="notenew" data-w="${w.id}">+ New</button></div>`+(n?`<input data-in="nt" data-n="${n.id}" value="${esc(n.t)}" placeholder="Title"><textarea data-in="nb" data-n="${n.id}" rows="5" placeholder="Start writing… (autosaves)">${esc(n.b)}</textarea><div class="row"><button data-a="noteback" data-w="${w.id}">← Back</button><button data-a="notepin" data-n="${n.id}">${n.p?'Unpin':'📌 Pin'}</button><button data-a="notedel" data-n="${n.id}" data-w="${w.id}">Delete</button></div>`:l.length?l.map(n=>`<div class="li" data-a="notesel" data-n="${n.id}" data-w="${w.id}" style="cursor:pointer">${n.p?'📌':'📝'}<span>${esc(n.t||'Untitled')}</span></div>`).join(''):empty('📝','No notes yet. Create your first one.'))},
todo:()=>`<input data-in="todoadd" placeholder="Add a task, press Enter">`+(S.todos.length?S.todos.map(t=>`<div class="li"><input type="checkbox" style="width:auto" data-a="todotog" data-n="${t.id}" ${t.d?'checked':''}><span style="${t.d?'text-decoration:line-through;opacity:.5':''}">${esc(t.t)}</span><button class="x" data-a="tododel" data-n="${t.id}">✕</button></div>`).join(''):empty('✅','All clear. Nothing to do.')),
links:(w)=>{const q=(w.q||'').toLowerCase(),l=S.bms.filter(b=>(b.t+b.f).toLowerCase().includes(q));const fs=[...new Set(l.map(b=>b.f||'General'))];
return `<div class="row"><input data-in="bq" data-w="${w.id}" placeholder="Search bookmarks" value="${esc(w.q||'')}"></div><div class="row"><input id="bt" placeholder="Title"><input id="bu" placeholder="https://…"><input id="bf" placeholder="Folder"><button data-a="bmadd">Add</button></div>`+(fs.length?fs.map(f=>`<div class="cat">${esc(f)}</div>`+l.filter(b=>(b.f||'General')==f).map(b=>`<div class="li" draggable="true" data-bm="${b.id}"><a href="${esc(b.u)}" target="_blank" rel="noopener">🔗 ${esc(b.t)}</a><button class="x" data-a="bmdel" data-n="${b.id}">✕</button></div>`).join('')).join(''):empty('🔖','No bookmarks match.'))},
games:()=>`<div class="row"><input id="gn" placeholder="Name"><input id="gi" placeholder="Icon emoji" style="max-width:90px"><input id="gu" placeholder="URL"><input id="gc" placeholder="Category"><button data-a="gameadd">Add</button></div>`+(S.games.length?`<div class="gm">${S.games.map(g=>`<a href="${esc(g.u)}" target="_blank" rel="noopener" data-a="gameopen" data-n="${g.id}"><i>${esc(g.i||'🎮')}</i><b>${esc(g.n)}</b><div class="mu" style="font-size:12px">${esc(g.c||'')}</div><span class="x" data-a="gamedel" data-n="${g.id}">remove</span></a>`).join('')}</div>`:empty('🎮','Your library is empty. Add your first game above.')),
calendar:(w)=>{const d=new Date(),y=d.getFullYear(),m=d.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let c='';for(let i=0;i<f;i++)c+='<div></div>';
for(let i=1;i<=n;i++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,e=S.events.find(x=>x.d==k);c+=`<div class="${i==d.getDate()?'t':''} ${e?'e':''}" style="${e?'--ec:'+e.c:''}">${i}</div>`}
const up=[...S.events].sort((a,b)=>a.d>b.d?1:-1).slice(0,5);
return `<div class="mu">${d.toLocaleString([],{month:'long',year:'numeric'})}</div><div class="cal">${c}</div><div class="row"><input id="et" placeholder="Event"><input id="ed" type="date" style="max-width:150px"><input id="ec" type="color" value="#7c3aed" style="max-width:48px;padding:2px"><button data-a="evadd">Add</button></div>`+up.map(e=>`<div class="li"><span style="color:${e.c}">●</span><span>${esc(e.t)} <small class="mu">${e.d}</small></span><button class="x" data-a="evdel" data-n="${e.id}">✕</button></div>`).join('')},
timer:(w)=>{const t=timers[w.id];return `<div class="big" data-timer="${w.id}">${t?fmt(t.left):'25:00'}</div><div class="row"><button data-a="timer" data-w="${w.id}">${t?.run?'Pause':'Start'}</button><button data-a="timerreset" data-w="${w.id}">Reset</button></div>`},
activity:()=>S.activity.length?S.activity.slice(0,8).map(a=>`<div class="li"><span>${esc(a.t)}</span><small class="mu">${ago(a.d)}</small></div>`).join(''):empty('⚡','Your activity will show up here.'),
stats:()=>`<div class="row" style="text-align:center">${[['Spaces',S.spaces.length],['Notes',S.notes.length],['Games',S.games.length],['Links',S.bms.length]].map(([a,b])=>`<div><div class="big" style="font-size:28px">${b}</div><div class="mu">${a}</div></div>`).join('')}</div>`};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
setInterval(()=>{document.querySelectorAll('[data-clock]').forEach(e=>e.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));for(const k in timers){const t=timers[k];if(t.run&&--t.left<=0){t.run=false;t.left=1500;S.notifs.unshift({id:id(),t:'Timer finished ⏱️',r:0});save();render()}const e=document.querySelector(`[data-timer="${k}"]`);if(e)e.textContent=fmt(t.left)}},1000);

/* ---------- main render ---------- */
function render(){if(!S||!U)return;if(!S.onboarded)return onboard();const sp=cur(),un=S.notifs.filter(n=>!n.r).length,a=anim;
$('#app').innerHTML=`<div class="shell" style="background:${wall(sp)}"><header class="top"><span class="logo">NEXORA</span>${isOwner()?'<span class="owner-badge">OWNER</span>':''}<span class="sp"></span><button class="srch hm" data-a="cmd">🔍 Search or run a command… <small>Ctrl K</small></button><button data-a="cmd" class="bnm">🔍</button>${isOwner()?'<button data-a="owner" title="Owner Panel">👑</button>':''}<button data-a="notif">🔔${un?`<span class="bdg">${un}</span>`:''}</button><button data-a="set">⚙️</button><button data-a="set" title="Profile">👤 <span class="hm">${esc(U.displayName||'Me')}</span></button></header>`
+`<nav class="side">${S.spaces.map(s=>`<button class="${s.id==sp.id?'on':''}" data-a="space" data-n="${s.id}" title="${esc(s.name)}">${s.icon}</button>`).join('')}<button data-a="newspace" title="New Space">＋</button></nav>`

function ownExport(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`nexora-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Backup downloaded');
  log('Owner exported data');
}

function ownImport(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json';
  inp.onchange=async()=>{
    const file=inp.files[0];if(!file)return;
    try{
      const text=await file.text();
      const data=JSON.parse(text);
      if(!data.spaces||!Array.isArray(data.spaces))throw new Error('Invalid backup format');
      if(!confirm('Replace ALL current data with this backup? This cannot be undone.'))return;
      S=data;
      if(!S.active&&S.spaces[0])S.active=S.spaces[0].id;
      save();render();close();
      toast('Backup restored');
      log('Owner imported data');
    }catch(e){toast('Import failed: '+e.message)}
  };
  inp.click();
}

  modal(`<h2>Raw state</h2><pre class="raw">${esc(JSON.stringify(S,null,2))}</pre><button data-a="owner">← Back to panel</button>`,true)
}
